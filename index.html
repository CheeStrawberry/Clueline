*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg-app);color:var(--tx);font:14px/1.45 var(--ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3,p{margin:0}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.s14{width:14px;height:14px}.ic.s16{width:16px;height:16px}.ic.s20{width:20px;height:20px}.ic.s24{width:24px;height:24px}
.ic[data-fill="1"] path{fill:currentColor}
#app{height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;min-height:0}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:var(--r-sm)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:var(--r-md);font-weight:600;font-size:14px;border:1px solid transparent;white-space:nowrap}
.btn.sm{height:28px;padding:0 10px;font-size:13px;gap:6px}.btn.lg{height:44px;padding:0 20px;font-size:15px}
.btn.primary{background:var(--bg-inverse);color:var(--tx-inv)}.btn.primary:hover{opacity:.88}
.btn.secondary{background:var(--bg-surface);border-color:var(--bd);color:var(--tx)}.btn.secondary:hover{background:var(--bg-hover)}
.btn.ghost{color:var(--tx2)}.btn.ghost:hover{background:var(--bg-hover);color:var(--tx)}
.btn.danger{background:var(--bad-bg);color:var(--bad);border-color:var(--string-bd)}.btn.danger:hover{filter:brightness(.97)}
.btn[disabled]{opacity:.45;pointer-events:none}
.ibtn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:var(--r-md);color:var(--tx2)}
.ibtn:hover{background:var(--bg-hover);color:var(--tx)}.ibtn.on{background:var(--bg-selected);color:var(--tx)}.ibtn.sm{width:26px;height:26px}
/* fields */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label{font-size:13px;font-weight:600}
.input{height:40px;padding:0 12px;border:1px solid var(--bd);border-radius:var(--r-md);background:var(--bg-surface);width:100%;min-width:0}
.input:focus{outline:2px solid var(--ring);outline-offset:-1px;border-color:transparent}
.input.err{border-color:var(--bad)}
textarea.input{height:auto;padding:10px 12px;resize:vertical;line-height:1.5}
select.input{appearance:none;background-image:none;padding-right:28px}
.hint{font-size:12.5px;color:var(--tx3)}.err-t{font-size:13px;color:var(--bad);display:flex;gap:6px;align-items:center}
.pwrap{position:relative}.pwrap .ibtn{position:absolute;right:4px;top:4px}
.check{display:flex;gap:8px;align-items:center;font-size:13.5px}
.check input{width:16px;height:16px;accent-color:var(--tx)}
.toggle{position:relative;width:40px;height:24px;border-radius:99px;background:var(--bd);flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:99px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.toggle[aria-checked="true"]{background:var(--ok)}.toggle[aria-checked="true"]::after{transform:translateX(16px)}
.seg{display:inline-flex;background:var(--bg-sunken);border-radius:var(--r-md);padding:2px;gap:2px}
.seg button{padding:4px 10px;border-radius:var(--r-sm);font-size:13px;font-weight:500;color:var(--tx2)}
.seg button.on{background:var(--bg-surface);color:var(--tx);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:99px;font-size:12px;font-weight:600}
.tag-clue{background:var(--clue-bg);color:var(--clue)}.tag-herring{background:var(--herring-bg);color:var(--herring)}.tag-alibi{background:var(--alibi-bg);color:var(--alibi)}.tag-reveal{background:var(--reveal-bg);color:var(--reveal)}.tag-question{background:var(--question-bg);color:var(--question)}.tag-answer{background:var(--reveal-bg);color:var(--reveal)}
.dot{width:8px;height:8px;border-radius:99px;background:currentColor;flex:none}

/* ---------- Auth ---------- */
.auth{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);height:100%;min-height:0;background:var(--bg-surface)}
.auth-form{display:flex;align-items:center;justify-content:center;padding:32px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.auth-card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:22px}
.auth-card h1{font:500 30px/1.15 var(--head);letter-spacing:-.01em}
.auth-card .sub{color:var(--tx2)}
.auth-visual{background:var(--bg-inverse);color:var(--tx-inv);padding:56px;display:flex;flex-direction:column;justify-content:space-between;gap:32px;overflow:hidden}
.auth-visual .eyebrow{font-size:12px;letter-spacing:.1em;font-weight:600;opacity:.6}
.auth-visual h2{font:500 38px/1.12 var(--head);margin-top:14px;max-width:460px;text-wrap:balance}
.lanes{background:color-mix(in srgb,var(--tx-inv) 9%,transparent);border-radius:var(--r-xl);padding:20px;display:flex;flex-direction:column;gap:14px}
.lanes .lab{font-size:11px;letter-spacing:.1em;font-weight:600;opacity:.55;margin-bottom:6px}
.lanes .row{display:flex;gap:8px}.lanes .row i{flex:1;height:30px;border-radius:var(--r-md);background:var(--c1);opacity:.85}
.lanes .row i.red{background:var(--string);opacity:1}.lanes .row.r2 i{background:var(--c3)}
.demo-box{border:1px dashed var(--bd-strong);border-radius:var(--r-md);padding:12px 14px;font-size:13px;color:var(--tx2);display:flex;gap:10px;align-items:center;justify-content:space-between}
.divider{display:flex;align-items:center;gap:12px;color:var(--tx3);font-size:13px}.divider::before,.divider::after{content:"";height:1px;background:var(--bd-subtle);flex:1}
.logo{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.01em}
.logo svg{width:28px;height:28px}
.logo b{color:var(--string);font-weight:700}
.auth .logo{--mascot:#262626}
@media (prefers-color-scheme:dark){body:not([data-mode]) .auth .logo{--mascot:inherit}}
.auth-art{color:#f4f1e8;--tx:currentColor;--mascot:currentColor;--bg-paper:#1d1b18;max-width:460px}
@media (prefers-color-scheme:dark){body:not([data-mode]) .auth-art{color:#262626;--bg-paper:#f4f4f5}}
body[data-mode="dark"] .auth-art{color:#262626;--bg-paper:#f4f4f5}
body[data-mode="dark"] .auth .logo{--mascot:inherit}
@media (max-width:860px){.auth{grid-template-columns:1fr}.auth-visual{display:none}}

/* ---------- Shell + Home ---------- */
.shell{display:flex;height:100%;min-height:0}
.side{width:240px;flex:none;background:var(--bg-surface);border-right:1px solid var(--bd-subtle);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow:auto}
.side .logo{padding:4px 8px 16px}
.side .nav{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:var(--r-md);color:var(--tx2);font-weight:500;width:100%;text-align:left}
.side .nav:hover{background:var(--bg-hover);color:var(--tx)}.side .nav.on{background:var(--bg-selected);color:var(--tx)}
.side .nav .n{margin-left:auto;font-size:12px;color:var(--tx3)}
.side .sp{flex:1}
.side .sec{font-size:11px;letter-spacing:.08em;font-weight:600;color:var(--tx3);padding:14px 10px 4px}
.me{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--r-md);width:100%;text-align:left;position:relative}
.me:hover{background:var(--bg-hover)}.me .nm{font-weight:600;font-size:13.5px;line-height:1.2}.me .em{font-size:12px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}
.av{width:32px;height:32px;border-radius:99px;display:grid;place-items:center;font-weight:600;font-size:12px;background:var(--ring-soft);color:var(--link);flex:none}
.av.xl{width:80px;height:80px;font-size:26px}
.main{flex:1;min-width:0;overflow:auto;padding:28px 40px 48px;display:flex;flex-direction:column;gap:32px}
.topbar{display:flex;gap:12px;align-items:center}
.search{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid var(--bd);border-radius:var(--r-md);background:var(--bg-surface);flex:1;max-width:560px;color:var(--tx3)}
.search input{border:0;background:none;outline:0;flex:1;min-width:0;color:var(--tx)}
.search:focus-within{outline:2px solid var(--ring);outline-offset:-1px}
.sech{font:500 22px/1.2 var(--head);margin-bottom:14px;display:flex;justify-content:space-between;align-items:baseline}
.sech a{font:500 13px var(--ui);color:var(--link);cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.start{border:1px solid var(--bd-subtle);background:var(--bg-surface);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:10px;text-align:left;transition:box-shadow .15s,border-color .15s}
.start:hover{box-shadow:var(--shadow);border-color:var(--bd)}
.start .bubble{width:40px;height:40px;border-radius:var(--r-md);background:var(--bg-sunken);display:grid;place-items:center}
.start b{font:500 17px var(--head)}.start span{color:var(--tx2);font-size:13px}
.book{background:var(--bg-surface);border:1px solid var(--bd-subtle);border-radius:var(--r-lg);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;position:relative;transition:box-shadow .15s}
.book:hover{box-shadow:var(--shadow)}
.cover{height:128px;background:var(--bg-sunken);padding:16px;display:flex;flex-direction:column;justify-content:space-between;border-bottom:1px solid var(--bd-subtle)}
.cover .t{font:500 17px/1.2 var(--head);text-wrap:balance}
.cover .st{font-size:11px;letter-spacing:.08em;font-weight:600;color:var(--tx3);text-transform:uppercase}
.book .meta{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.book .meta b{font-weight:600;display:block;line-height:1.25}.book .meta small{color:var(--tx3);font-size:12px}
.book .star{position:absolute;top:8px;right:8px;color:var(--tx3);background:var(--bg-surface);border-radius:99px}
.book .star.on{color:var(--warn)}.book .star.on svg path{fill:currentColor}
.empty{border:1px dashed var(--bd);border-radius:var(--r-lg);padding:40px;text-align:center;color:var(--tx2);display:flex;flex-direction:column;gap:10px;align-items:center}
.menu{position:absolute;z-index:60;background:var(--bg-surface);border:1px solid var(--bd-subtle);border-radius:var(--r-lg);box-shadow:var(--pop);padding:6px;min-width:200px}
.menu button,.menu .mi{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:var(--r-sm);font-size:13.5px;text-align:left;color:var(--tx)}
.menu button:hover{background:var(--bg-hover)}.menu hr{border:0;border-top:1px solid var(--bd-subtle);margin:4px 0}
.menu .head{padding:8px 10px 6px}.menu .head b{display:block}.menu .head small{color:var(--tx3)}
.menu .k{margin-left:auto;color:var(--tx3);font-size:12px}
.menu .dng{color:var(--bad)}

/* modal / toast */
.scrim{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:var(--bg-surface);border-radius:var(--r-xl);box-shadow:var(--pop);width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:16px}
.modal.wide{max-width:1000px}
.modal h2{font:500 22px var(--head)}
.modal .acts{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--bg-inverse);color:var(--tx-inv);padding:10px 16px;border-radius:var(--r-md);box-shadow:var(--pop);z-index:200;font-weight:500;display:flex;gap:8px;align-items:center}

/* ---------- Settings ---------- */
.set-tabs{display:flex;gap:20px;border-bottom:1px solid var(--bd-subtle)}
.set-tabs button{padding:8px 2px;font-weight:500;color:var(--tx2);border-bottom:2px solid transparent;margin-bottom:-1px}
.set-tabs button.on{color:var(--tx);border-color:var(--tx)}
.set-body{display:flex;flex-direction:column;gap:20px;max-width:760px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;background:var(--bg-surface);border:1px solid var(--bd-subtle);border-radius:var(--r-lg)}
.srow b{display:block;font-weight:600}.srow small{color:var(--tx2);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--bg-surface);border:1px solid var(--bd-subtle);border-radius:var(--r-lg);padding:14px 16px}.stat small{color:var(--tx3);display:block}.stat b{font:500 24px var(--head)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.themes{display:flex;gap:16px;flex-wrap:wrap}
.theme{width:200px;text-align:left;display:flex;flex-direction:column;gap:8px;font-weight:500}
.theme .pv{height:96px;border-radius:var(--r-lg);border:1px solid var(--bd);padding:14px;display:flex;flex-direction:column;gap:8px}
.theme .pv i{height:8px;border-radius:4px;opacity:.5}
.theme.on .pv{outline:2px solid var(--ring);outline-offset:1px}

/* ---------- Editor ---------- */
.ed{display:flex;flex-direction:column;height:100%;min-height:0;background:var(--bg-surface)}
.etop{display:flex;align-items:center;gap:12px;height:48px;padding:0 12px;border-bottom:1px solid var(--bd-subtle);flex:none}
.etop .ttl{font-weight:600;border:0;background:none;padding:4px 6px;border-radius:var(--r-sm);min-width:80px;max-width:340px}
.etop .ttl:hover,.etop .ttl:focus{background:var(--bg-hover);outline:0}
.save{font-size:12.5px;color:var(--tx3);display:flex;align-items:center;gap:6px}
.save.ok{color:var(--ok)}
.menubar{display:flex;gap:2px;height:30px;padding:0 10px;border-bottom:1px solid var(--bd-subtle);align-items:center;flex:none;position:relative}
.menubar>button{padding:3px 9px;border-radius:var(--r-sm);font-size:13px;color:var(--tx2)}
.menubar>button:hover,.menubar>button.on{background:var(--bg-hover);color:var(--tx)}
.toolbar{display:flex;align-items:center;gap:6px;height:42px;padding:0 12px;border-bottom:1px solid var(--bd-subtle);flex:none;overflow-x:auto;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.toolbar .sep{width:1px;height:20px;background:var(--bd-subtle);flex:none;margin:0 4px}
.toolbar select.input{height:28px;width:auto;padding:0 24px 0 8px;font-size:13px}
.tbtn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:var(--r-sm);font-size:12.5px;font-weight:600;flex:none}
.tbtn:hover{filter:brightness(.96)}.tbtn.plain{color:var(--tx2)}.tbtn.plain:hover{background:var(--bg-hover);color:var(--tx)}
.ebody{display:flex;flex:1;min-height:0}
.lpanel{width:320px;flex:none;border-right:1px solid var(--bd-subtle);display:flex;flex-direction:column;min-height:0;background:var(--bg-surface)}
.lpanel.right{border-right:0;border-left:1px solid var(--bd-subtle);width:340px}
.ph{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.ph h3{font-size:15px;font-weight:600}
.pbody{flex:1;overflow:auto;padding:4px 12px 16px;display:flex;flex-direction:column;gap:12px;min-height:0}
.psub{color:var(--tx2);font-size:13px;padding:0 4px}
.canvas{flex:1;min-width:0;background:var(--bg-sunken);overflow:auto;padding:28px 24px 80px;display:flex;justify-content:center;align-items:flex-start}
.page{background:var(--bg-paper);border:1px solid var(--bd-subtle);border-radius:var(--r-md);box-shadow:var(--shadow);width:100%;max-width:760px;padding:56px 72px 72px;transform-origin:top center}
.page .clabel{font-size:11px;letter-spacing:.14em;font-weight:600;color:var(--tx3);margin-bottom:6px}
.page .ctitle{font:500 34px/1.15 var(--head);border:0;background:none;width:100%;padding:0;margin-bottom:28px;outline:0;color:var(--tx)}
.prose{font:400 16px/1.75 var(--serif);outline:0;min-height:260px;white-space:pre-wrap;word-break:break-word}
.prose p{margin:0 0 1em;min-height:1.75em}
.prose:empty::before,.prose[data-empty="1"]::before{content:attr(data-ph);color:var(--tx3)}
.hl{border-radius:3px;padding:1px 0;cursor:pointer;box-decoration-break:clone}
.hl.k-clue{background:var(--clue-bg);box-shadow:0 -2px 0 var(--clue-bg),inset 0 -2px 0 var(--clue)}
.hl.k-herring{background:var(--herring-bg);box-shadow:inset 0 -2px 0 var(--herring)}
.hl.k-alibi{background:var(--alibi-bg);box-shadow:inset 0 -2px 0 var(--alibi)}
.hl.k-reveal,.hl.k-answer{background:var(--reveal-bg);box-shadow:inset 0 -2px 0 var(--reveal)}
.hl.k-question{background:var(--question-bg);box-shadow:inset 0 -2px 0 var(--question)}
.hl.sel{outline:2px solid var(--ring)}
.hl.flag{background:var(--bad-bg);box-shadow:inset 0 -2px 0 var(--bad)}
.nohl .hl{background:none;box-shadow:none}
.rail{width:48px;flex:none;border-left:1px solid var(--bd-subtle);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px;background:var(--bg-surface)}
.rail button{width:36px;height:36px;border-radius:var(--r-md);display:grid;place-items:center;color:var(--tx2);position:relative}
.rail button:hover{background:var(--bg-hover);color:var(--tx)}.rail button.on{background:var(--bg-selected);color:var(--tx)}
.rail .bd{position:absolute;top:3px;right:3px;min-width:15px;height:15px;border-radius:99px;background:var(--string);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 3px}
.rail .tip{display:none;position:absolute;right:44px;background:var(--bg-inverse);color:var(--tx-inv);font-size:12px;padding:4px 8px;border-radius:var(--r-sm);white-space:nowrap;z-index:50;pointer-events:none}
.rail button:hover .tip{display:block}
.tbar{display:flex;align-items:center;gap:10px;height:36px;padding:0 14px;border-top:1px solid var(--bd-subtle);background:var(--bg-surface);flex:none;font-weight:600;font-size:13px;width:100%}
.tbar .iss{margin-left:6px;font-weight:600;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--ok-bg);color:var(--ok);display:inline-flex;gap:4px;align-items:center}
.tbar .iss.bad{background:var(--bad-bg);color:var(--bad)}
.tpanel{border-top:1px solid var(--bd-subtle);background:var(--bg-surface);flex:none;height:250px;display:flex;flex-direction:column;min-height:0}
.tctl{display:flex;align-items:center;gap:12px;padding:8px 14px;flex:none;flex-wrap:wrap}
.tctl .sp{flex:1}
.tctl input[type=range]{width:120px;accent-color:var(--tx)}
.tscroll{flex:1;overflow:auto;padding:4px 14px 14px;min-height:0}
.evrow{display:flex;gap:12px;align-items:stretch;width:max-content;min-width:100%}
.ev{width:var(--evw,190px);flex:none;border:1px solid var(--bd);background:var(--bg-surface);border-radius:var(--r-md);padding:10px 12px;display:flex;flex-direction:column;gap:3px;text-align:left;position:relative}
.ev:hover{border-color:var(--bd-strong)}.ev.sel{border-color:var(--ring);box-shadow:0 0 0 2px var(--ring-soft)}
.ev.bad{border-color:var(--string-bd);background:var(--string-soft)}.ev.ghost{border-style:dashed;opacity:.75}
.ev .tm{font-size:12px;color:var(--tx3);font-weight:600}.ev b{font-weight:600;line-height:1.25}.ev .mt{font-size:12px;color:var(--tx2)}
.ev .tl{position:absolute;left:12px;right:12px;top:-8px;height:2px;background:var(--bd)}
.lane{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.lane .ln{width:96px;flex:none;font-weight:600;color:var(--tx2);padding-top:10px;font-size:13px}
.lane .evrow{min-width:0}
.card{background:var(--bg-surface);border:1px solid var(--bd-subtle);border-radius:var(--r-lg);padding:12px 14px}
.rv{border:1px solid var(--bd-subtle);border-radius:var(--r-lg);overflow:hidden;background:var(--bg-surface)}
.rv>button{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;font-weight:600;text-align:left}
.rv>button .ct{margin-left:auto;font-size:12px;background:var(--bg-sunken);padding:0 7px;border-radius:99px;color:var(--tx2)}
.rv ul{margin:0;padding:0 12px 12px;list-style:none;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--bd-subtle);padding-top:10px}
.rv li{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.35}.rv li .dot{margin-top:6px;width:6px;height:6px}
.rv li small{color:var(--tx3);display:block;font-size:12px}
.rv.revealed .dot,.rv.revealed>button>.dot{color:var(--ok)}.rv.hinted .dot,.rv.hinted>button>.dot{color:var(--warn)}.rv.hidden .dot,.rv.hidden>button>.dot{color:var(--tx3)}
.picker{display:flex;align-items:center;gap:6px}.picker select{flex:1}
.exp{background:var(--ring-soft);border-radius:var(--r-lg);padding:10px 12px;font-size:13px;color:var(--tx)}
.bar{height:6px;border-radius:99px;background:var(--bg-sunken);overflow:hidden}.bar i{display:block;height:100%;background:var(--c1)}
.finding{border:1px solid var(--bd-subtle);border-radius:var(--r-lg);padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--bg-surface)}
.finding .sv{font-size:11px;letter-spacing:.08em;font-weight:700}
.finding.high{border-color:var(--string-bd)}.finding.high .sv{color:var(--bad)}.finding.medium .sv{color:var(--warn)}.finding.low .sv{color:var(--tx3)}
.finding b{font-weight:600}.finding p{font-size:13px;color:var(--tx2)}.finding .fa{display:flex;gap:8px;margin-top:2px}
.clist{display:flex;flex-direction:column;gap:6px}
.crow{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--bd-subtle);border-radius:var(--r-md);background:var(--bg-surface);text-align:left;width:100%}
.crow:hover{border-color:var(--bd)}.crow.sel{border-color:var(--ring);background:var(--ring-soft)}
.crow .t{flex:1;min-width:0}.crow .t b{display:block;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.crow .t small{color:var(--tx3);font-size:12px}
/* navigator */
.tree{display:flex;flex-direction:column;gap:1px}
.n-act{display:flex;align-items:center;gap:6px;padding:6px 6px;font-size:12px;letter-spacing:.04em;font-weight:700;color:var(--tx2);text-transform:uppercase;width:100%;text-align:left;border-radius:var(--r-sm);margin-top:6px}
.n-act:hover{background:var(--bg-hover)}.n-act small{margin-left:auto;font-weight:500;text-transform:none;letter-spacing:0;color:var(--tx3)}
.n-ch{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 18px;border-radius:var(--r-md);width:100%;text-align:left}
.n-ch:hover{background:var(--bg-hover)}.n-ch.on{background:var(--bg-selected)}
.n-ch .tx{flex:1;min-width:0}.n-ch .tx b{display:block;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.n-ch .tx small{color:var(--tx3);font-size:12px}
.n-ch .flag{width:8px;height:8px;border-radius:99px;background:var(--string);flex:none}
.n-sc{display:flex;gap:8px;align-items:center;padding:4px 8px 4px 44px;font-size:13px;color:var(--tx2);width:100%;text-align:left;border-radius:var(--r-sm)}
.n-sc:hover{background:var(--bg-hover);color:var(--tx)}.n-sc span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.n-sc small{color:var(--tx3)}
.n-add{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--bd-subtle);font-weight:500;color:var(--tx2);width:100%;text-align:left}.n-add:hover{background:var(--bg-hover);color:var(--tx)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:99px;border:1px solid var(--bd);font-size:12.5px;font-weight:500;color:var(--tx2)}
.chip.on{background:var(--bg-inverse);border-color:var(--bg-inverse);color:var(--tx-inv)}
.thread{border:1px solid var(--bd-subtle);border-radius:var(--r-lg);padding:10px 12px;display:flex;gap:10px;background:var(--bg-surface)}
.thread .tg{font-size:10.5px;letter-spacing:.08em;font-weight:700;width:58px;flex:none;padding-top:2px}
.thread.source .tg{color:var(--link)}.thread.affected .tg{color:var(--warn)}.thread.broken{border-color:var(--string-bd);background:var(--string-soft)}.thread.broken .tg{color:var(--bad)}.thread.safe .tg{color:var(--ok)}
.thread b{font-weight:600;display:block;font-size:13.5px}.thread small{color:var(--tx2);font-size:12.5px}
.pop{position:fixed;z-index:80;background:var(--bg-surface);border:1px solid var(--bd-subtle);border-radius:var(--r-lg);box-shadow:var(--pop);padding:8px;display:flex;flex-direction:column;gap:8px;width:300px}
.pop .kinds{display:flex;gap:6px;flex-wrap:wrap}
.two-tl{display:flex;flex-direction:column;gap:16px}
.lanebox{border:1px solid var(--bd-subtle);border-radius:var(--r-lg);padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.lanebox .lh{display:flex;gap:10px;align-items:baseline}.lanebox .lh b{font-size:12px;letter-spacing:.1em}.lanebox .lh span{color:var(--tx3);font-size:13px}
.lanebox .evrow{width:auto;flex-wrap:wrap}
.gap-m{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--warn-bg);color:var(--warn);display:inline-flex}
.gap-m.bad{background:var(--bad-bg);color:var(--bad)}.gap-m.ok{background:var(--ok-bg);color:var(--ok)}
.mobile-note{display:none}
@media (max-width:1100px){.lpanel.right,.lpanel{position:absolute;z-index:40;top:0;bottom:0;box-shadow:var(--pop)}.lpanel{left:0}.lpanel.right{right:48px}.ebody{position:relative}}
@media (max-width:760px){
  .side{display:none}.main{padding:20px 16px 40px}.page{padding:28px 20px}.two{grid-template-columns:1fr}
  .shell{flex-direction:column}.mobile-top{display:flex!important}
  .lpanel,.lpanel.right{width:min(92vw,340px)}
}
.mobile-top{display:none;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--bd-subtle);background:var(--bg-surface)}

.pbody>*{flex:none}

body{overflow-x:hidden}
.ed,.ebody,.canvas{min-width:0}
@media (max-width:760px){
  .etop{gap:6px;padding:0 8px;overflow:hidden}.etop .search,#goal,.etop .pill{display:none}.etop .ttl{flex:1;min-width:0;max-width:none}
  .save{font-size:12px;white-space:nowrap}.canvas{padding:16px 10px 80px}.page{padding:28px 18px 40px}.page .ctitle{font-size:26px}
  .tctl{gap:8px}.tctl input[type=range]{width:80px}.tpanel{height:300px}
  .menubar{overflow-x:auto}.main{padding:20px 14px 40px}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .cover{height:104px}.set-tabs{overflow-x:auto}.themes{gap:10px}.theme{width:100%}
  .srow{flex-wrap:wrap}.modal{padding:18px}.pop{width:min(300px,92vw)}
}
.toolbar select.input{min-width:150px}

/* ---- v3: views, timeline list, story map, motion ---- */
.viewseg button{padding:5px 14px}
.viewmount{flex:1;min-height:0;overflow:auto;background:var(--bg-app,var(--bg-surface))}
.viewbody{padding:24px 28px;display:flex;gap:24px;align-items:flex-start;min-width:0}
.vmain{flex:1;min-width:0;max-width:760px;display:flex;flex-direction:column;gap:16px}
.vside{width:340px;flex:none;position:sticky;top:0;display:flex;flex-direction:column;gap:12px}
.vhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.vhead h1{font:500 28px var(--head)}.vhead p{color:var(--tx2);max-width:520px;margin-top:4px}
.tlist{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;gap:14px;text-align:left;padding:10px 12px;border:1px solid var(--bd-subtle);border-radius:var(--r-lg);background:var(--bg-surface);transition:border-color .15s,background .15s}
.trow:hover{border-color:var(--bd);background:var(--bg-hover)}.trow.sel{border-color:var(--ring);box-shadow:0 0 0 3px var(--ring-soft)}
.trow.bad{border-color:var(--string-bd);background:var(--string-soft)}.trow.ghost{border-style:dashed;opacity:.8}
.ttime{width:64px;flex:none;font-weight:600;font-variant-numeric:tabular-nums;color:var(--tx2)}
.tcard{display:flex;flex-direction:column;gap:4px;min-width:0}.tcard .mt{font-size:12.5px;color:var(--tx2)}
.tchips{display:flex;gap:6px;flex-wrap:wrap}.chipx{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--bg-sunken);color:var(--tx2)}.chipx.ok{background:var(--ok-bg);color:var(--ok)}
.tprob{display:flex;gap:6px;align-items:flex-start;font-size:13px;color:var(--bad)}
.verdict{display:flex;gap:6px;align-items:flex-start;font-size:13px;margin:6px 0 0}.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}.verdict.warn{color:var(--warn)}
.whatif{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:var(--r-md);background:var(--bg-sunken);font-size:13px}
.secret{display:flex;flex-direction:column;gap:6px}.secret.bad{border-color:var(--string-bd)}.srow2{display:flex;gap:10px;font-size:13px}.srow2 .lab{width:64px;color:var(--tx3)}.none{color:var(--tx3)}
.lnk{color:var(--link);font-weight:500}.lnk:hover{text-decoration:underline}
.popopt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;padding:6px;border-radius:var(--r-sm);text-align:left}.popopt:hover{background:var(--bg-hover)}.popopt small{color:var(--tx2);font-size:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--tx2)}.lg{display:inline-flex;align-items:center;gap:6px}
.mdot{width:10px;height:10px;border-radius:99px;flex:none;display:inline-block}.mdot.k-clue{background:var(--clue)}.mdot.k-herring{background:var(--herring)}.mdot.k-reveal{background:var(--reveal)}
.mslider{display:flex;flex-direction:column;gap:6px;font-size:13px;min-width:220px}
.mapwrap{overflow:auto;border:1px solid var(--bd-subtle);border-radius:var(--r-lg);background:var(--bg-surface);padding:16px}
.mapin{position:relative;width:max-content;min-width:100%}.mapcols{display:flex;gap:28px;align-items:flex-start}.strings{position:absolute;inset:0;pointer-events:none}
.mapcol{width:230px;flex:none;display:flex;flex-direction:column;gap:12px}.mapacth{font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3)}
.mapch{border:1px solid var(--bd);border-radius:var(--r-md);padding:8px 10px;background:var(--bg-surface);display:flex;flex-direction:column;gap:6px;transition:opacity .15s}
.mapch.flag{border-color:var(--string);box-shadow:0 0 0 2px var(--string-soft)}.mapch.late{opacity:.3}
.mapchh{display:flex;flex-direction:column;text-align:left}.mapchh small{color:var(--tx3)}
.marks{display:flex;flex-direction:column;gap:2px}.mk{display:flex;gap:8px;align-items:center;font-size:12.5px;text-align:left;padding:2px 4px;border-radius:var(--r-sm)}.mk:hover{background:var(--bg-hover)}.mk span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nomark{font-size:12px;color:var(--tx3)}
@media (max-width:900px){.viewbody{flex-direction:column;padding:16px}.vside{width:100%;position:static}.vmain{max-width:none}}
.fade{animation:cfade .15s ease}@keyframes cfade{from{opacity:0}to{opacity:1}}
.modal,.menu,.pop,.toast{animation:cfade .15s ease}
.btn,.ibtn,.chip,.crow,.n-ch,.seg button{transition:background .15s,border-color .15s,color .15s}
.lpanel{transition:opacity .15s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---- v4: illustrations, reader's view, warmer paper ---- */
.ill{display:flex;justify-content:center}.ill svg{width:100%;max-width:300px;height:auto;overflow:visible}.ill.big svg{max-width:220px}

</style>
<div id="app"></div>
<script>
/* ClueLine story engine: plain logic, no AI. Works on a project object. */
(function (root) {
  const CL = {};
  const KINDS = ['clue', 'herring', 'alibi', 'reveal', 'question', 'answer'];
  CL.KIND_LABEL = { clue: 'Clue', herring: 'Red herring', alibi: 'Alibi', reveal: 'Reveal', question: 'Question', answer: 'Answer' };
  CL.KINDS = KINDS;

  CL.uid = (p) => (p || 'x') + Math.random().toString(36).slice(2, 8);
  CL.idx = (p, cid) => p.chapters.findIndex((c) => c.id === cid);
  CL.parseTime = (s) => { const m = /^(\d{1,2}):(\d{2})$/.exec(s || ''); return m ? (+m[1]) * 60 + (+m[2]) : 0; };
  CL.fmtTime = (s) => {
    const m = /^(\d{1,2}):(\d{2})$/.exec(s || ''); if (!m) return s || '';
    let h = +m[1]; const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12; return h + ':' + m[2] + ' ' + ap;
  };
  CL.travel = (p, a, b) => {
    if (a === b) return 0; const t = p.travel || {};
    return t[a + '|' + b] ?? t[b + '|' + a] ?? 20;
  };
  CL.suspectName = (p, id) => (p.suspects.find((s) => s.id === id) || {}).name || '';
  CL.eventById = (p, id) => p.events.find((e) => e.id === id);

  CL.locate = function (p, tag) {
    const home = CL.idx(p, tag.chapterId);
    const order = [];
    if (home >= 0) order.push(home);
    p.chapters.forEach((_, i) => { if (i !== home) order.push(i); });
    const q = tag.quote || ''; if (!q) return null;
    for (const i of order) {
      const t = p.chapters[i].text;
      let s = t.indexOf(q);
      if (s < 0) s = t.toLowerCase().indexOf(q.toLowerCase());
      if (s >= 0) return { idx: i, start: s, end: s + q.length, moved: i !== home };
    }
    return null;
  };

  CL.analyze = function (p) {
    const loc = {};
    p.tags.forEach((t) => { loc[t.id] = CL.locate(p, t); });
    const revealIdx = {};
    p.tags.forEach((t) => {
      if (t.kind === 'reveal' && t.event && loc[t.id]) {
        const i = loc[t.id].idx;
        if (!(t.event in revealIdx) || i < revealIdx[t.event]) revealIdx[t.event] = i;
      }
    });
    const dismissed = p.dismissed || [];
    const findings = [];
    const push = (f) => { f.key = f.type + ':' + (f.ref || ''); f.dismissed = dismissed.includes(f.key); findings.push(f); };
    const ch = (i) => 'chapter ' + (i + 1);
    const evLabel = (id) => (CL.eventById(p, id) || {}).label || '';

    // 1. Information revealed too early
    p.events.forEach((e) => {
      const r = revealIdx[e.id];
      if (r === undefined || !(e.leak && e.leak.length)) return;
      for (let i = 0; i < r; i++) {
        const t = p.chapters[i].text, low = t.toLowerCase();
        for (const term of e.leak) {
          const s = low.indexOf(term.toLowerCase());
          if (s >= 0) {
            push({
              type: 'early', sev: 'high', basis: 'text', chapterIdx: i, start: s, end: s + term.length,
              quote: t.slice(s, s + term.length), eventId: e.id, revealIdx: r, ref: e.id + '@' + p.chapters[i].id,
              title: 'Revealed too early',
              body: 'In ' + ch(i) + ' a character mentions "' + t.slice(s, s + term.length) + '", but the reader is not told this until ' + ch(r) + '. The reveal there would fall flat.'
            });
            break;
          }
        }
      }
    });

    // 2 + 3. Twists: clues must exist and come before the solution
    (p.twists || []).forEach((tw) => {
      const ti = CL.idx(p, tw.chapterId);
      (tw.needs || []).forEach((tid) => {
        const tag = p.tags.find((t) => t.id === tid); if (!tag) return;
        const l = loc[tid];
        if (!l) {
          push({
            type: 'broken', sev: 'high', basis: 'text', tagId: tid, twistId: tw.id, ref: tid + '>' + tw.id,
            title: 'A clue the solution needs is gone',
            body: 'The solution "' + tw.label + '" depends on "' + tag.label + '", but that passage is no longer in the draft.'
          });
        } else if (ti >= 0 && l.idx > ti) {
          push({
            type: 'late', sev: 'high', basis: 'text', chapterIdx: l.idx, start: l.start, end: l.end, quote: tag.quote, tagId: tid, twistId: tw.id, solIdx: ti,
            ref: tid + '>' + tw.id,
            title: 'The decisive clue arrives after the solution',
            body: '"' + tag.label + '" first appears in ' + ch(l.idx) + ', but the solution is explained in ' + ch(ti) + '. The reader may not have had a fair chance to solve it.'
          });
        }
      });
    });
    p.tags.forEach((t) => {
      if (!loc[t.id] && !(p.twists || []).some((tw) => (tw.needs || []).includes(t.id))) {
        push({ type: 'orphan', sev: 'low', basis: 'text', tagId: t.id, ref: t.id, title: 'Tagged passage was edited out', body: 'The passage tagged "' + t.label + '" is no longer in the draft. Remove the tag or re-tag the new wording.' });
      }
    });

    // 4. Impossible timeline (true events only)
    p.suspects.forEach((s) => {
      const evs = p.events.filter((e) => e.kind !== 'claim' && (e.who || []).includes(s.id)).sort((a, b) => CL.parseTime(a.time) - CL.parseTime(b.time));
      for (let k = 0; k + 1 < evs.length; k++) {
        const a = evs[k], b = evs[k + 1];
        if (a.place === b.place) continue;
        const gap = CL.parseTime(b.time) - CL.parseTime(a.time), need = CL.travel(p, a.place, b.place);
        if (gap < need) {
          push({
            type: 'timeline', sev: 'high', basis: 'text', eventId: b.id, eventId2: a.id, who: s.id, ref: s.id + ':' + a.id + ':' + b.id,
            title: s.name + ' cannot be in two places',
            body: s.name + ' is at the ' + a.place + ' at ' + CL.fmtTime(a.time) + ' and at the ' + b.place + ' at ' + CL.fmtTime(b.time) + '. That is ' + gap + ' min, and the trip takes about ' + need + '.'
          });
        }
      }
    });

    // 4b. A character who has been found dead appears alive again with nothing to say it is earlier
    p.events.filter((d) => d.death).forEach((d) => {
      const rd = revealIdx[d.id]; if (rd === undefined) return;
      const rt = p.tags.find((t) => t.kind === 'reveal' && t.event === d.id && loc[t.id] && loc[t.id].idx === rd);
      const rs = rt ? loc[rt.id].start : 0;
      p.tags.forEach((t) => {
        const e = CL.eventById(p, t.event), l = loc[t.id];
        if (!e || e.id === d.id || e.kind === 'claim' || !l) return;
        if (!(e.who || []).some((w) => (d.who || []).includes(w))) return;
        if (l.idx < rd || (l.idx === rd && l.start <= rs)) return;
        const ctx = p.chapters[l.idx].text.slice(Math.max(0, l.start - 90), l.end);
        if (/\b(earlier|before|that (night|evening)|ago|had been|remembered)\b/i.test(ctx)) return;
        const who = CL.suspectName(p, d.who[0]);
        push({ type: 'ghost', sev: 'high', basis: 'text', chapterIdx: l.idx, start: l.start, end: l.end, quote: t.quote, tagId: t.id, eventId: e.id, eventId2: d.id, revealIdx: rd, ref: t.id + '>' + d.id,
          title: who + ' appears after dying', body: who + ' is found dead in ' + ch(rd) + ', but ' + ch(l.idx) + ' shows ' + who + ' alive again, with nothing to say it happened earlier. Mark it as a flashback or move it.' });
      });
    });

    // 5. Claims (what a character says) against the true timeline
    p.events.filter((e) => e.kind === 'claim').forEach((c) => {
      const who = (c.who || [])[0];
      const clash = p.events.find((e) => e.kind !== 'claim' && (e.who || []).includes(who) && e.place !== c.place &&
        Math.abs(CL.parseTime(e.time) - CL.parseTime(c.time)) < CL.travel(p, e.place, c.place));
      if (!clash) return;
      const exposed = p.tags.some((t) => t.event === c.id && t.kind === 'clue' && loc[t.id]);
      if (!exposed) {
        push({ type: 'lie', sev: 'medium', basis: 'text', eventId: c.id, ref: c.id, title: 'A lie the reader is never shown to be false',
          body: CL.suspectName(p, who) + ' says "' + c.label + '", which the true timeline contradicts. No clue shows the reader it is false.' });
      } else {
        push({ type: 'claim', sev: 'info', basis: 'text', eventId: c.id, ref: c.id, title: 'A claim that conflicts with the truth',
          body: CL.suspectName(p, who) + ' says "' + c.label + '". It conflicts with the true timeline, and a clue exposes it. Fine if this is an intended lie.' });
      }
    });

    // 6. Gaps: never planted, never revealed
    p.events.filter((e) => e.kind !== 'claim' && e.hidden).forEach((e) => {
      const r = revealIdx[e.id];
      if (r === undefined) {
        if (!e.optional) push({ type: 'unrevealed', sev: 'medium', basis: 'text', eventId: e.id, ref: e.id, title: 'The reader never learns this',
          body: '"' + e.label + '" is part of what really happened, but no reveal is tagged for it.' });
      } else {
        const has = p.tags.some((t) => t.event === e.id && t.kind === 'clue' && loc[t.id] && loc[t.id].idx < r);
        if (!has) push({ type: 'unplanted', sev: 'medium', basis: 'text', eventId: e.id, ref: e.id, title: 'Revealed without a clue planted first',
          body: 'The reveal of "' + e.label + '" in ' + ch(r) + ' comes with no earlier clue. Readers may call it unfair.' });
      }
    });
    p.tags.filter((t) => t.kind === 'question').forEach((q) => {
      const a = q.answerTag && p.tags.find((t) => t.id === q.answerTag);
      if (!a || !loc[a.id]) {
        push({ type: 'question', sev: 'low', basis: 'text', tagId: q.id, ref: q.id, title: 'A question is never answered',
          body: '"' + q.label + '" is raised in the draft and never answered.' });
      }
    });

    // 7. Suspicion estimates
    const sc = (n) => CL.suspicionAt(p, loc, n);
    let sol = (p.twists || []).filter((t) => t.solution).map((t) => CL.idx(p, t.chapterId)).filter((i) => i >= 0);
    sol = sol.length ? Math.min.apply(null, sol) : p.chapters.length - 1;
    if (p.culprit && sol > 0) {
      const before = sc(sol - 1);
      const mine = (before.find((x) => x.id === p.culprit) || {}).score || 0;
      if (mine < 2) {
        push({ type: 'unsupported', sev: 'medium', basis: 'estimate', ref: p.culprit, title: 'Little evidence points at the culprit',
          body: 'Before the solution in ' + ch(sol) + ', your tags give ' + CL.suspectName(p, p.culprit) + ' a suspicion score of ' + mine + '. This is an estimate from your tags.' });
      }
      for (let n = 0; n < sol; n++) {
        const row = sc(n), me = (row.find((x) => x.id === p.culprit) || {}).score || 0;
        const other = Math.max.apply(null, row.filter((x) => x.id !== p.culprit).map((x) => x.score).concat([0]));
        if (me >= 3 && me >= 2 * Math.max(other, 1) && n <= Math.floor((p.chapters.length - 1) * 0.5)) {
          push({ type: 'predictable', sev: 'low', basis: 'estimate', chapterIdx: n, ref: 'p' + n, title: 'The reader may guess the culprit early',
            body: 'By ' + ch(n) + ', your tags make ' + CL.suspectName(p, p.culprit) + ' look guilty well ahead of everyone else. This is an estimate, not a fact about your readers.' });
          break;
        }
      }
    }
    const order = { high: 0, medium: 1, low: 2, info: 3 };
    findings.sort((a, b) => order[a.sev] - order[b.sev]);
    return { loc, revealIdx, findings, active: findings.filter((f) => !f.dismissed && f.sev !== 'info') };
  };

  CL.suspicionAt = function (p, loc, n) {
    return p.suspects.map((s) => {
      let score = 0, herring = 0;
      p.tags.forEach((t) => {
        if (t.suspect !== s.id || !loc[t.id] || loc[t.id].idx > n) return;
        const w = t.weight == null ? 1 : t.weight;
        if (t.kind === 'clue') score += w;
        else if (t.kind === 'herring') { score += w; herring += w; }
        else if (t.kind === 'alibi') score -= Math.abs(w);
      });
      return { id: s.id, name: s.name, score: Math.max(0, score), herring };
    });
  };

  CL.readerAt = function (p, a, n) {
    const knows = [];
    p.tags.forEach((t) => {
      const l = a.loc[t.id];
      if (!l || l.idx > n) return;
      if (['clue', 'reveal', 'answer', 'alibi', 'herring'].includes(t.kind)) knows.push({ tag: t, idx: l.idx });
    });
    knows.sort((x, y) => y.idx - x.idx);
    const leaks = a.findings.filter((f) => f.type === 'early' && f.chapterIdx <= n && f.revealIdx > n);
    const hidden = p.events.filter((e) => e.kind !== 'claim' && e.hidden && !e.optional && !(a.revealIdx[e.id] <= n))
      .map((e) => ({ event: e, revealIdx: a.revealIdx[e.id] }));
    const open = p.tags.filter((t) => t.kind === 'question' && a.loc[t.id] && a.loc[t.id].idx <= n).filter((q) => {
      const ans = q.answerTag && a.loc[q.answerTag]; return !(ans && ans.idx <= n);
    });
    return { knows, leaks, hidden, open, suspicion: CL.suspicionAt(p, a.loc, n) };

      ['The empty boat', "Wil Ashby's rowboat drifted into the reeds at Marrow Lake with its oars shipped neatly and its owner nowhere. His sister Edda reported him missing at dusk. His ex-wife Joss was the first to arrive at the shore, and she had already brought a flask and a blanket, as if she had been expecting a cold night."],
      ['The ex-wife', "Joss told Constable Hart she had not seen Wil in a month. Then she mentioned his new boots, which Hart knew had been bought only on Friday. Joss laughed it off, but the laugh came a beat too late, and she turned her wedding ring on her thumb, a ring she had supposedly given back."],
      ["Joss's car", "In the lay-by above the lake sat Joss's car, its bonnet still warm and its boot lined with plastic sheeting. She said it was for a gardening job. Hart wrote down the plate and a note: lakeside, dark, nobody to see her. Joss's phone had gone off the network at six."],

      ["Upstairs", "Upstairs, in the long sitting room, four friends had claimed the fire. Daniel had brought the whisky, Maya the good glasses, and Theo a deck of cards nobody wanted to play. Priya sat on the arm of the sofa with her shoes off, telling a story about a wedding that kept getting worse. The clock on the mantel said ten to ten. Candles leaned in their saucers whenever the wind found the chimney. The evening was still young."],
      ["The Sound", "At twelve minutes past ten, something struck the floor below, a dull, heavy sound, like a chair going over. The laughter thinned. Daniel tilted his head toward the stairs. \"Probably the shutters,\" Theo said. \"Probably,\" Daniel agreed. Then he heard it again. He set down his glass on the mantel, picked up the torch, and stood. \"Two minutes,\" he said. Nobody watched him go. The door clicked shut behind him."],
      ["The Empty Chair", "Two minutes became ten. Theo dealt a hand no one looked at. Priya finished her wedding story to a polite silence. Daniel's chair stayed empty, still turned toward the fire, and on the mantel the ice had melted in his untouched glass, leaving a pale ring on the wood. At twenty to eleven Maya stood and picked up her coat. \"I should go,\" she said. \"It's getting late.\" Theo shrugged, but he had stopped shuffling. Somewhere beneath them the house creaked, a long, slow note."],
      ["The Stairs", "Maya took the lamp from the landing table and went down the stairs one careful step at a time, her own shadow bending ahead of her. At the foot of the stairs the lamp light found a shoe, then a trouser leg, then Daniel, lying very still on the cold flagstones beside a bloodied knife, his torch rolled into the corner. It was ten fifty-two."],

      ["The Toast", "Upstairs, Daniel raised his glass. \"To the storm,\" he said, and the firelight turned the whisky amber. Theo laughed. Priya was already reaching for the bottle, and the candles leaned together as the wind found the chimney. Outside, the rain kept up its long argument with the roof."],
